# Modified for pujahalder34675-creator/pdfocr standalone CI.
name: zizmor

# Static analysis of GitHub Actions workflows (https://docs.zizmor.sh).
# Findings go to the repo's Security > Code scanning tab; this job does not fail
# PRs. Part of hardening how we publish packages (Linear INF-459).

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        # The standalone repository may not have SARIF uploads enabled.
        continue-on-error: ${{ github.repository != 'run-llama/liteparse' }}
        with:
          advanced-security: ${{ github.repository == 'run-llama/liteparse' }}
          annotations: ${{ github.repository != 'run-llama/liteparse' }}
          version: 1.32.0
